name: dsbench validate

on:
  pull_request:
    paths: ["datasets/**", "formats/**", "dsbench/**", "tests/**", "pipeline/**", "pyproject.toml", "uv.lock", ".github/workflows/**"]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.9"
      - name: Środowisko z lockfile (zależności + grupa dev)
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.9"
      - name: Instalacja (rdzeń = ten sam silnik co lokalnie, S3)
        run: uv sync --locked --python 3.11
      - name: Testy silnika
        run: uv run pytest
      - name: Audyt kart datasetów (bramka; formatka z pola `format` karty; card.yaml + card.md)
        run: |
          set -e
          fail=0
          for card in $(find datasets \( -name card.yaml -o -name card.md \)); do
            echo "::group::$card"
            uv run dsbench audit --card "$card" || fail=1
            echo "::endgroup::"
          done
          exit $fail
